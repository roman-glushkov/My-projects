<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineLog - Профиль</title>
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f7f9fb;
        color: #1a2c44;
        text-align: center;
        padding: 50px;
      }
      .success-message {
        background-color: #d4edda;
        color: #155724;
        padding: 20px;
        border-radius: 10px;
        max-width: 600px;
        margin: 0 auto 30px;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        background-color: #3b5a83;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 500;
        transition: background 0.3s;
      }
      .btn:hover {
        background-color: #2f4867;
      }
    </style>
  </head>
  <body>
    <div class="success-message">
      <h1>Регистрация прошла успешно!</h1>
      <p>Теперь вы можете войти в систему, используя ваши учетные данные.</p>
    </div>

    <a href="login.html" class="btn">Перейти к входу</a>
  </body>
</html>
