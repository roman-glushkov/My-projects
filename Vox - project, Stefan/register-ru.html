<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1440, initial-scale=1" />
  <title>Vox — Регистрация</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <main class="auth-card">
      <div class="logo">Vox</div>
      <div class="toggle">
        <a href="index-ru.html" class="inactive">Вход</a>
        <a href="register-ru.html" class="active">Регистрация</a>
      </div>
      <form class="form">
        <label class="input"><input type="text" placeholder="Фамилия"></label>
        <label class="input"><input type="text" placeholder="Имя"></label>
        <label class="input"><input type="email" placeholder="Электронная почта"></label>
        <label class="input"><input type="password" placeholder="Пароль"></label>
        <label class="input"><input type="password" placeholder="Подтверждение пароля"></label>
        <label class="input"><input type="date" placeholder="Дата рождения"></label>
        <div class="photo-upload">
          <div class="photo-box">+</div>
          <span class="photo-text">Добавить фото (опционально)</span>
        </div>
        <button class="primary" type="submit">Зарегистрироваться</button>
      </form>
      <div class="lang-switch">
        <a href="register.html">EN</a> | <a href="register-ru.html" class="active">RU</a>
      </div>
    </main>
  </div>
</body>
</html>
