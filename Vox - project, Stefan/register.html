<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1440, initial-scale=1" />
  <title>Vox — Create Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <main class="auth-card">
      <div class="logo">Vox</div>
      <div class="toggle">
        <a href="index.html" class="inactive">Login</a>
        <a href="register.html" class="active">Create account</a>
      </div>
      <form class="form">
        <label class="input"><input type="text" placeholder="Last name"></label>
        <label class="input"><input type="text" placeholder="First name"></label>
        <label class="input"><input type="email" placeholder="E-mail"></label>
        <label class="input"><input type="password" placeholder="Password"></label>
        <label class="input"><input type="password" placeholder="Confirm password"></label>
        <label class="input"><input type="date" placeholder="Date of birth"></label>
        <div class="photo-upload">
          <div class="photo-box">+</div>
          <span class="photo-text">Add photo (optional)</span>
        </div>
        <button class="primary" type="submit">Create Account</button>
      </form>
      <div class="lang-switch">
        <a href="register.html" class="active">EN</a> | <a href="register-ru.html">RU</a>
      </div>
    </main>
  </div>
</body>
</html>
